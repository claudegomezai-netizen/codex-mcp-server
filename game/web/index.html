<title>Ironhold</title>
<style>
  :root {
    --void: #0e1116;
    --iron: #1b2029;
    --grid: #232a35;
    --steel: #3a4454;
    --hero: #6bc7ff;
    --blood: #e45c6b;
    --jade: #6fd1a0;
    --violet: #c74edb;
    --gold: #ffcb3d;
    --gold-dim: #7a6220;
    --text: #e8edf5;
    --muted: #8894a6;

    --label: 700 11px/1 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    --num: 700 15px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--void);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  #stage { position: fixed; inset: 0; display: block; touch-action: none; }

  /* ---- HUD ---------------------------------------------------------- */

  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    padding: max(12px, env(safe-area-inset-top)) 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .rail { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }

  .stack-left { display: flex; flex-direction: column; gap: 7px; }
  .stack-right { display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }

  .eyebrow {
    font: var(--label);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .wave {
    font: 800 17px/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .wave.boss { color: var(--violet); }

  .health {
    width: 128px;
    height: 7px;
    border-radius: 99px;
    background: #00000070;
    overflow: hidden;
  }
  .health i {
    display: block;
    height: 100%;
    width: 100%;
    background: var(--jade);
    transform-origin: left;
    transition: transform 0.12s linear, background 0.2s;
  }
  .health.low i { background: var(--blood); }

  .coin { display: flex; align-items: center; gap: 6px; font: var(--num); font-variant-numeric: tabular-nums; }
  .coin::before {
    content: "";
    width: 11px; height: 11px;
    border-radius: 99px;
    background: var(--gold);
    box-shadow: inset 0 0 0 2px #00000030;
  }
  .coin.dim::before { background: var(--gold-dim); }

  .carry { font: var(--num); font-variant-numeric: tabular-nums; color: var(--muted); }
  .carry.full { color: var(--gold); }

  .towers { font: var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  /* Active boons. The bar drains, so time remaining is read without numbers. */
  .buffs { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .buff {
    display: flex; align-items: center; gap: 6px;
    font: var(--label); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .buff .bar {
    width: 44px; height: 4px; border-radius: 99px;
    background: #ffffff1f; overflow: hidden;
  }
  .buff .bar i {
    display: block; height: 100%; width: 100%;
    background: currentColor; transform-origin: right;
  }

  button {
    pointer-events: auto;
    font: 700 13px/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    background: #ffffff14;
    border: 1px solid #ffffff1f;
    border-radius: 99px;
    padding: 9px 15px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #ffffff22; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- Upgrade drawer ------------------------------------------------ */

  .spacer { flex: 1; }

  .drawer {
    pointer-events: auto;
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 13px;
    border-radius: 16px;
    background: #12161de6;
    border: 1px solid #ffffff14;
    backdrop-filter: blur(14px);
    max-width: 460px;
    width: 100%;
    margin: 0 auto;
    margin-bottom: max(6px, env(safe-area-inset-bottom));
  }
  .drawer.open { display: flex; }

  .drawer-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .drawer-head .note { font: var(--label); color: var(--muted); letter-spacing: 0.04em; text-transform: none; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 11px;
    border-radius: 10px;
    background: #ffffff08;
    border: 1px solid transparent;
    text-align: left;
    letter-spacing: 0;
    text-transform: none;
    font: inherit;
    cursor: not-allowed;
    opacity: 0.5;
    transition: background 0.15s, opacity 0.15s;
  }
  .row.can { cursor: pointer; opacity: 1; background: #ffffff14; }
  .row.can:hover { background: #ffffff1f; }

  .row .name { font: 700 14px/1.25 ui-sans-serif, -apple-system, system-ui, sans-serif; }
  .row .blurb { font: 500 11px/1.3 ui-sans-serif, -apple-system, system-ui, sans-serif; color: var(--muted); }
  .row .lv {
    font: var(--num); font-size: 11px; font-variant-numeric: tabular-nums;
    color: var(--muted); letter-spacing: 0.06em;
  }
  .row .price {
    font: var(--num); font-variant-numeric: tabular-nums;
    min-width: 54px; text-align: right; color: var(--muted);
  }
  .row.can .price { color: var(--gold); }

  /* ---- Centre messaging ---------------------------------------------- */

  .banner {
    position: fixed;
    left: 50%; top: 26%;
    transform: translate(-50%, -50%);
    font: 800 clamp(26px, 8vw, 40px)/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-shadow: 0 3px 18px #000000cc;
    pointer-events: none;
    opacity: 0;
  }
  .banner.show { animation: pop 1.8s ease-out forwards; }
  .banner.boss { color: var(--violet); }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.86); }
    12%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Countdown digits are bigger and land inside one second, so each number
     clears before the next arrives instead of cross-fading into a smear. */
  .banner.count, .banner.go {
    font-size: clamp(64px, 22vw, 130px);
    letter-spacing: 0;
  }
  .banner.count.show, .banner.go.show { animation: count 1s ease-out forwards; }
  .banner.go { color: var(--jade); font-size: clamp(44px, 15vw, 92px); }
  @keyframes count {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    18%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.86); }
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font: var(--label);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    white-space: nowrap;
    color: #ffffff59;
    pointer-events: none;
    transition: opacity 0.5s;
  }

  @media (prefers-reduced-motion: reduce) {
    .banner.show { animation-duration: 1.8s; }
    * { transition-duration: 0.01ms !important; }
  }
</style>

<canvas id="stage"></canvas>

<div class="hud">
  <div class="rail">
    <div class="stack-left">
      <div class="wave" id="wave">Wave 1</div>
      <div class="health" id="healthWrap"><i id="health"></i></div>
      <div class="coin" id="bankWrap"><span id="bank">0</span></div>
    </div>
    <div class="stack-right">
      <div class="carry" id="carry">0/20</div>
      <div class="towers" id="towers">0 towers</div>
      <div class="buffs" id="buffs"></div>
      <button id="toggle" type="button">Upgrades</button>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <span class="eyebrow">Hero upgrades</span>
      <span class="note">Deposit at the gold ring to earn</span>
    </div>
    <div id="rows"></div>
  </div>
</div>

<div class="banner" id="banner"></div>
<div class="hint" id="hint">Drag to move</div>

<script>
"use strict";

/* ====================================================================
   BALANCE — mirrors Sources/IronholdCore/Balance.swift.
   Balance.swift is the source of truth; this block is a copy kept in
   sync by hand. See DESIGN.md for why each growth rate is what it is.
   ==================================================================== */
const B = {
  costGrowth: 1.18,
  powerGrowth: 1.10,
  attackSpeedGrowth: 1.03,
  enemyHealthGrowth: 1.10,
  tokenDropGrowth: 1.125,

  arena: 1600,
  base: { x: 800, y: 800 },
  plotRingRadius: 300,
  stationCount: 7,
  bankStationIndex: 0,
  spawnRingInner: 420,
  spawnRingOuter: 520,

  heroMaxHealth: 150,
  heroHealthRegenPerSecond: 3.5,
  heroRadius: 26,
  heroBaseMoveSpeed: 235,
  heroMoveSpeedPerLevel: 12,
  heroMaxMoveSpeed: 420,
  heroInvulnerabilityAfterHit: 0.55,
  heroRespawnDelay: 3.0,
  heroDeathTokenLoss: 0.5,

  swordBaseDamage: 14,
  swordBaseInterval: 0.80,
  swordMinInterval: 0.16,
  swordRange: 96,
  swordArc: Math.PI * 0.75,
  swordWindup: 0.12,
  swordKnockback: 90,

  baseCarryCapacity: 20,
  carryCapacityPerLevel: 8,
  basePickupRadius: 78,
  pickupRadiusPerLevel: 14,
  tokenMagnetSpeed: 620,
  tokenMagnetAcceleration: 1800,
  tokenLifetime: 45,

  // Power-ups. They exist to break the rhythm of a loop that is otherwise very
  // even: hero power only ever changes at a deposit station, so a run has no
  // spikes. Each of these is a spike, and each pulls the player somewhere they
  // were not already going.
  powerUpSpawnInterval: [16, 26],
  powerUpGroundLifetime: 14,
  powerUpSpawnDistance: [170, 330],
  powerUpRadius: 26,
  maxActivePowerUps: 3,
  powerUpDurations: { frenzy: 8, magnet: 9, greed: 10, bulwark: 6, surge: 0 },
  frenzyAttackSpeedMultiplier: 2.4,
  magnetPickupMultiplier: 4.0,
  // Greed is the only power-up that touches income. Because the pacing
  // guardrail measures a ratio between early and late purchases, a uniform
  // income lift shifts every time down together and leaves the drift alone.
  greedTokenMultiplier: 2.0,
  surgeRadius: 260,
  surgeDamageMultiplier: 9,

  // What each denomination is worth. A payout is broken into these exactly,
  // largest first, so a kill pays the same total as before — this is making
  // change, not extra income. 1 must be present for change to be exact, and
  // the largest must fit an unupgraded satchel since coins are taken whole.
  coinValues: { sat: 1, eth: 2, sol: 5, btc: 10 },
  maxPickupsPerDenomination: 3,

  depositRate: 14,
  plotInteractionRadius: 62,

  towerBaseDamage: 6,
  towerBaseInterval: 1.0,
  towerMinInterval: 0.2,
  towerRange: 265,
  towerRadius: 30,

  enemyBaseHealth: 20,
  enemyBaseDamage: 8,
  enemyBaseSpeed: 100,
  enemyRadius: 22,
  enemyAttackInterval: 1.1,
  enemyBaseTokenDrop: 5,
  enemySeparationSpeed: 155,
  enemyPersonalSpace: 1.35,
  enemyOverlapIterations: 2,

  // A beat before wave 1 so the player can read the arena — where the bank is,
  // where the plots are — before anything is chasing them.
  startCountdown: 3,
  waveDuration: 30,
  waveBreak: 5,
  baseSpawnsPerWave: 24,
  spawnsPerWaveGrowth: 1.11,
  maxConcurrentEnemies: 140,
  bossWaveInterval: 5,
  bossHealthMultiplier: 14,
  bossDamageMultiplier: 2.2,
  bossSpeedMultiplier: 0.62,
  bossTokenMultiplier: 12,
  bossRadiusMultiplier: 2.1,

  towerBuildCost: 35,
  // How much world the short screen edge shows. At 780 the hero was 26px
  // across on a phone and the arena read as empty; 520 puts him at roughly a
  // tenth of the screen width, where the genre sits.
  visibleWorldWidth: 520,
};

const UPGRADES = [
  { key: "heroDamage",    name: "Sword",     blurb: "Heavier blade",              price: 48 },
  { key: "attackSpeed",   name: "Swing",     blurb: "Faster swings",              price: 78 },
  { key: "moveSpeed",     name: "Boots",     blurb: "Move quicker",               price: 66 },
  { key: "carryCapacity", name: "Satchel",   blurb: "Carry more tokens",          price: 60 },
  { key: "pickupRadius",  name: "Lodestone", blurb: "Pull tokens from further",   price: 60 },
];

/* ---- Economy -------------------------------------------------------- */

const lv = {};
UPGRADES.forEach(u => (lv[u.key] = 0));

const priceOf   = k => Math.round(UPGRADES.find(u => u.key === k).price * B.costGrowth ** lv[k]);
const towerCost = level => Math.round(B.towerBuildCost * B.costGrowth ** level);

const heroDamage     = () => B.swordBaseDamage * B.powerGrowth ** lv.heroDamage;
const moveSpeed      = () => Math.min(B.heroMaxMoveSpeed, B.heroBaseMoveSpeed + B.heroMoveSpeedPerLevel * lv.moveSpeed);
const carryCapacity  = () => B.baseCarryCapacity + B.carryCapacityPerLevel * lv.carryCapacity;

// Power-ups multiply the upgraded value rather than replacing it, so a boon is
// worth the same proportion whatever the build looks like. The game's own
// floor still applies — Frenzy cannot beat the minimum swing interval.
const attackInterval = () => {
  const base = Math.max(B.swordMinInterval, B.swordBaseInterval / B.attackSpeedGrowth ** lv.attackSpeed);
  return active.frenzy > 0 ? Math.max(B.swordMinInterval, base / B.frenzyAttackSpeedMultiplier) : base;
};
const pickupRadius = () => {
  const base = B.basePickupRadius + B.pickupRadiusPerLevel * lv.pickupRadius;
  return active.magnet > 0 ? base * B.magnetPickupMultiplier : base;
};

const towerDamage   = level => (level > 0 ? B.towerBaseDamage * B.powerGrowth ** (level - 1) : 0);
const towerInterval = level => Math.max(B.towerMinInterval, B.towerBaseInterval / 1.03 ** Math.max(0, level - 1));

const enemyHealth    = wave => B.enemyBaseHealth * B.enemyHealthGrowth ** (wave - 1);
const enemyDamage    = wave => B.enemyBaseDamage * 1.04 ** (wave - 1);
const enemyTokenDrop = wave => Math.max(1, Math.round(B.enemyBaseTokenDrop * B.tokenDropGrowth ** (wave - 1)));
const spawnCount     = wave => Math.round(B.baseSpawnsPerWave * B.spawnsPerWaveGrowth ** (wave - 1));
const isBossWave     = wave => wave > 0 && wave % B.bossWaveInterval === 0;

/* ---- World state ---------------------------------------------------- */

const stationPos = i => {
  const a = (i / B.stationCount) * Math.PI * 2 - Math.PI / 2;
  return { x: B.base.x + Math.cos(a) * B.plotRingRadius, y: B.base.y + Math.sin(a) * B.plotRingRadius };
};
const bankPos = stationPos(B.bankStationIndex);

const hero = {
  x: B.base.x, y: B.base.y,
  facing: -Math.PI / 2,
  health: B.heroMaxHealth,
  carried: 0,
  cooldown: 0,
  windup: -1,
  invuln: 0,
  respawn: 0,
};

// Cosmetic only: which denominations are in the satchel, so the stack above
// the head shows the actual mix rather than ten identical discs. The
// simulation still tracks a single carried total.
const carriedCoins = [];
function trimCarriedCoins() {
  let total = 0;
  for (const k of carriedCoins) total += B.coinValues[k];
  while (carriedCoins.length && total > hero.carried) {
    total -= B.coinValues[carriedCoins.shift()];
  }
}

let enemies = [], tokens = [], effects = [], powerUps = [];
// Seconds remaining on each running boon. Instant kinds never land here.
const active = { frenzy: 0, magnet: 0, greed: 0, bulwark: 0 };
const POWER_KINDS = ["frenzy", "magnet", "greed", "bulwark", "surge"];
let powerUpTimer = B.powerUpSpawnInterval[0] +
  Math.random() * (B.powerUpSpawnInterval[1] - B.powerUpSpawnInterval[0]);

let bank = 0, elapsed = 0, killed = 0, depositRemainder = 0;
let shake = 0, camX = B.base.x, camY = B.base.y;

const plots = [];
for (let i = 0; i < B.stationCount; i++) {
  if (i === B.bankStationIndex) continue;
  const p = stationPos(i);
  plots.push({ x: p.x, y: p.y, level: 0, deposited: 0, cooldown: 0, pulse: 0 });
}

const director = {
  wave: 0, inBreak: true, breakTimer: 0, remaining: 0, acc: 0, timeInWave: 0,
  countdown: B.startCountdown, lastCount: -1,
};

/* ---- Input ---------------------------------------------------------- */

const input = { x: 0, y: 0 };
const keys = new Set();
let stick = null;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

addEventListener("keydown", e => {
  keys.add(e.key.toLowerCase());
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

function readKeys() {
  let x = 0, y = 0;
  if (keys.has("a") || keys.has("arrowleft")) x -= 1;
  if (keys.has("d") || keys.has("arrowright")) x += 1;
  if (keys.has("w") || keys.has("arrowup")) y += 1;
  if (keys.has("s") || keys.has("arrowdown")) y -= 1;
  const len = Math.hypot(x, y);
  return len > 0 ? { x: x / len, y: y / len } : null;
}

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  stick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
  hideHint();
});
canvas.addEventListener("pointermove", e => {
  if (stick && stick.id === e.pointerId) { stick.x = e.clientX; stick.y = e.clientY; }
});
const dropStick = e => { if (stick && stick.id === e.pointerId) stick = null; };
canvas.addEventListener("pointerup", dropStick);
canvas.addEventListener("pointercancel", dropStick);

const MAX_TRAVEL = 62;
function readStick() {
  if (!stick) return null;
  const dx = stick.x - stick.ox, dy = -(stick.y - stick.oy);
  const dist = Math.hypot(dx, dy);
  if (dist < 0.001) return { x: 0, y: 0 };
  const clamped = Math.min(dist, MAX_TRAVEL);
  const mag = clamped / MAX_TRAVEL;
  // Dead zone stops a resting thumb drifting; full speed before the rim.
  const shaped = mag < 0.12 ? 0 : Math.min(1, (mag - 0.12) / 0.58);
  return { x: (dx / dist) * shaped, y: (dy / dist) * shaped };
}

let hintVisible = true;
function hideHint() {
  if (!hintVisible) return;
  hintVisible = false;
  document.getElementById("hint").style.opacity = "0";
}
if (!matchMedia("(pointer: coarse)").matches) {
  document.getElementById("hint").textContent = "WASD or arrows to move";
}

/* ---- Simulation ----------------------------------------------------- */

function nearestEnemy(x, y, range) {
  let best = null, bestD = Infinity;
  for (const e of enemies) {
    const reach = range + e.radius;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d <= reach * reach && d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function spawnEnemy() {
  const wave = Math.max(1, director.wave);
  const boss = isBossWave(wave);
  const angle = Math.random() * Math.PI * 2;
  // Wave 1 spawns close and on-screen: the opening seconds decide whether
  // a casual player stays.
  const scale = wave === 1 ? 0.55 : 1;
  const dist = (B.spawnRingInner + Math.random() * (B.spawnRingOuter - B.spawnRingInner)) * scale;

  let hp = enemyHealth(wave), dmg = enemyDamage(wave);
  let spd = B.enemyBaseSpeed * (0.9 + Math.random() * 0.25);
  let radius = B.enemyRadius, drop = enemyTokenDrop(wave);

  if (boss) {
    hp *= B.bossHealthMultiplier;
    dmg *= B.bossDamageMultiplier;
    spd *= B.bossSpeedMultiplier;
    radius *= B.bossRadiusMultiplier;
    drop = Math.round(drop * B.bossTokenMultiplier);
  }

  enemies.push({
    boss,
    x: Math.min(Math.max(hero.x + Math.cos(angle) * dist, 40), B.arena - 40),
    y: Math.min(Math.max(hero.y + Math.sin(angle) * dist, 40), B.arena - 40),
    health: hp, maxHealth: hp, damage: dmg, speed: spd, radius,
    drop, attackCooldown: 0, kx: 0, ky: 0, flash: 0, born: elapsed,
  });
}

function stepWaves(dt) {
  const d = director;

  // A beat before the first wave. Nothing spawns, but the hero can already
  // move, so the arena can be read before anything is chasing them.
  if (d.countdown > 0) {
    d.countdown = Math.max(0, d.countdown - dt);
    const shown = Math.ceil(d.countdown);
    if (shown !== d.lastCount) {
      d.lastCount = shown;
      announce(shown > 0 ? String(shown) : "Go", false, shown === 0);
    }
    return;
  }

  if (d.inBreak) {
    d.breakTimer -= dt;
    if (d.breakTimer > 0) return;
    d.wave += 1;
    d.inBreak = false;
    d.timeInWave = 0;
    d.acc = 0;
    d.remaining = isBossWave(d.wave) ? 1 : spawnCount(d.wave);
    announce(isBossWave(d.wave) ? `Boss — Wave ${d.wave}` : `Wave ${d.wave}`, isBossWave(d.wave));
    return;
  }

  d.timeInWave += dt;
  let spawns = 0;

  if (d.remaining > 0) {
    if (isBossWave(d.wave)) {
      spawns = d.remaining;
      d.remaining = 0;
    } else {
      // Spread spawns across 80% of the wave so the faucet never stops.
      d.acc += (spawnCount(d.wave) / (B.waveDuration * 0.8)) * dt;
      while (d.acc >= 1 && d.remaining > 0) { d.acc -= 1; d.remaining -= 1; spawns++; }
    }
  }

  const room = Math.max(0, B.maxConcurrentEnemies - enemies.length);
  if (spawns > room) { d.remaining += spawns - room; spawns = room; }
  for (let i = 0; i < spawns; i++) spawnEnemy();

  const cleared = d.remaining === 0 && enemies.length + spawns === 0;
  if (cleared || d.timeInWave >= B.waveDuration * 2.5) {
    d.inBreak = true;
    d.breakTimer = B.waveBreak;
  }
}

function damageHero(amount) {
  // Bulwark absorbs the hit entirely. No invulnerability window is set,
  // because the whole point is to stand in a swarm and keep swinging.
  if (active.bulwark > 0) return;

  hero.health -= amount;
  hero.invuln = B.heroInvulnerabilityAfterHit;
  shake = Math.min(26, shake + 5);
  if (hero.health > 0) return;

  hero.health = 0;
  hero.respawn = B.heroRespawnDelay;
  const lost = Math.floor(hero.carried * B.heroDeathTokenLoss);
  hero.carried -= lost;
  shake = Math.min(26, shake + 20);
  if (lost > 0) effects.push({ kind: "text", text: `-${lost}`, x: hero.x, y: hero.y, life: 0.9, max: 0.9, color: "#e45c6b" });
}

function stepPowerUps(dt) {
  for (const k of Object.keys(active)) {
    if (active[k] > 0) active[k] = Math.max(0, active[k] - dt);
  }

  // Nothing appears before the run starts, or while the hero is down — a boon
  // that expires on the respawn timer is a boon wasted.
  if (director.countdown > 0 || hero.respawn > 0) return;

  powerUpTimer -= dt;
  if (powerUpTimer <= 0) {
    const [lo, hi] = B.powerUpSpawnInterval;
    powerUpTimer = lo + Math.random() * (hi - lo);
    spawnPowerUp();
  }

  for (const p of powerUps) p.age += dt;

  const reach = B.powerUpRadius + B.heroRadius;
  const taken = powerUps.filter(p =>
    (p.x - hero.x) ** 2 + (p.y - hero.y) ** 2 <= reach * reach);
  for (const p of taken) applyPowerUp(p);

  powerUps = powerUps.filter(p => !taken.includes(p) && p.age < B.powerUpGroundLifetime);
}

function spawnPowerUp() {
  // Placed around the hero rather than at a fixed point, so collecting one is
  // always a decision about leaving the fight you are in.
  const a = Math.random() * Math.PI * 2;
  const [lo, hi] = B.powerUpSpawnDistance;
  const d = lo + Math.random() * (hi - lo);
  const m = B.powerUpRadius + 20;
  powerUps.push({
    x: Math.min(Math.max(hero.x + Math.cos(a) * d, m), B.arena - m),
    y: Math.min(Math.max(hero.y + Math.sin(a) * d, m), B.arena - m),
    kind: POWER_KINDS[Math.floor(Math.random() * POWER_KINDS.length)],
    age: 0,
  });
}

function applyPowerUp(p) {
  if (p.kind === "surge") { detonateSurge(hero.x, hero.y); return; }

  // Re-collecting something already running refreshes it rather than stacking,
  // so a lucky streak cannot compound into a permanent buff.
  const running = Object.keys(active).filter(k => active[k] > 0);
  if (active[p.kind] <= 0 && running.length >= B.maxActivePowerUps) {
    let shortest = running[0];
    for (const k of running) if (active[k] < active[shortest]) shortest = k;
    active[shortest] = 0;
  }
  active[p.kind] = B.powerUpDurations[p.kind];
  announce(POWER_STYLE[p.kind].label, false, false);
}

function detonateSurge(x, y) {
  const damage = heroDamage() * B.surgeDamageMultiplier;
  effects.push({ kind: "surge", x, y, life: 0.45, max: 0.45 });
  shake = Math.min(26, shake + 18);

  for (const e of enemies) {
    const reach = B.surgeRadius + e.radius;
    if ((e.x - x) ** 2 + (e.y - y) ** 2 > reach * reach) continue;
    e.health -= damage;
    e.flash = 0.14;
    const dx = e.x - x, dy = e.y - y;
    const len = Math.hypot(dx, dy) || 1;
    e.kx = (dx / len) * B.swordKnockback * 2.2;
    e.ky = (dy / len) * B.swordKnockback * 2.2;
  }
}

function stepHero(dt) {
  hero.invuln = Math.max(0, hero.invuln - dt);

  if (hero.respawn > 0) {
    hero.respawn -= dt;
    if (hero.respawn <= 0) {
      hero.respawn = 0;
      hero.x = B.base.x; hero.y = B.base.y;
      hero.health = B.heroMaxHealth;
      hero.invuln = 1.2;
    }
    return;
  }

  if (hero.health < B.heroMaxHealth) {
    hero.health = Math.min(B.heroMaxHealth, hero.health + B.heroHealthRegenPerSecond * dt);
  }

  const mag = Math.hypot(input.x, input.y);
  if (mag > 0.001) {
    const s = Math.min(1, mag);
    hero.x += (input.x / mag) * s * moveSpeed() * dt;
    hero.y += (input.y / mag) * s * moveSpeed() * dt;
    hero.facing = Math.atan2(input.y, input.x);
  }
  hero.x = Math.min(Math.max(hero.x, B.heroRadius), B.arena - B.heroRadius);
  hero.y = Math.min(Math.max(hero.y, B.heroRadius), B.arena - B.heroRadius);
}

function resolveSwing() {
  const dmg = heroDamage();
  const half = B.swordArc / 2;
  const reach = B.swordRange + B.heroRadius;

  for (const e of enemies) {
    const dx = e.x - hero.x, dy = e.y - hero.y;
    if (dx * dx + dy * dy > reach * reach + e.radius * e.radius) continue;
    let delta = (Math.atan2(dy, dx) - hero.facing) % (Math.PI * 2);
    if (delta > Math.PI) delta -= Math.PI * 2;
    if (delta < -Math.PI) delta += Math.PI * 2;
    if (Math.abs(delta) > half) continue;

    e.health -= dmg;
    e.flash = 0.12;
    const len = Math.hypot(dx, dy) || 1;
    e.kx = (dx / len) * B.swordKnockback;
    e.ky = (dy / len) * B.swordKnockback;
  }
}

function stepSword(dt) {
  if (hero.respawn > 0) return;
  hero.cooldown = Math.max(0, hero.cooldown - dt);

  if (hero.windup >= 0) {
    hero.windup -= dt;
    if (hero.windup <= 0) { hero.windup = -1; resolveSwing(); }
    return;
  }
  if (hero.cooldown > 0) return;

  const target = nearestEnemy(hero.x, hero.y, B.swordRange);
  if (!target) return;

  // The player never aims, so the hero aims for them.
  hero.facing = Math.atan2(target.y - hero.y, target.x - hero.x);
  hero.cooldown = attackInterval();
  hero.windup = Math.min(B.swordWindup, attackInterval() * 0.4);
  effects.push({ kind: "swing", x: hero.x, y: hero.y, facing: hero.facing, life: 0.16, max: 0.16 });
}

function stepTowers(dt) {
  for (const p of plots) {
    p.pulse = Math.max(0, p.pulse - dt);
    if (p.level === 0) continue;
    p.cooldown = Math.max(0, p.cooldown - dt);
    if (p.cooldown > 0) continue;

    const target = nearestEnemy(p.x, p.y, B.towerRange);
    if (!target) continue;

    p.cooldown = towerInterval(p.level);
    target.health -= towerDamage(p.level);
    target.flash = 0.1;
    effects.push({ kind: "tracer", x: p.x, y: p.y, tx: target.x, ty: target.y, life: 0.12, max: 0.12 });
  }
}

function stepEnemies(dt) {
  for (const e of enemies) {
    e.flash = Math.max(0, e.flash - dt);

    if (e.kx * e.kx + e.ky * e.ky > 1) {
      e.x += e.kx * dt; e.y += e.ky * dt;
      const decay = Math.max(0, 1 - dt * 8);
      e.kx *= decay; e.ky *= decay;
    }

    let dx = hero.x - e.x, dy = hero.y - e.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;

    // Separation is its own velocity, added after pursuit is scaled to full
    // speed. Folding it into the heading and normalising the sum throws its
    // magnitude away, which is why crowds used to collapse into one stack.
    let px = 0, py = 0;
    for (const o of enemies) {
      if (o === e) continue;
      const ox = e.x - o.x, oy = e.y - o.y;
      const min = (e.radius + o.radius) * B.enemyPersonalSpace;
      const d2 = ox * ox + oy * oy;
      if (d2 < min * min && d2 > 0.001) {
        const d = Math.sqrt(d2);
        px += (ox / d) * ((min - d) / min);
        py += (oy / d) * ((min - d) / min);
      }
    }
    const pl = Math.hypot(px, py);
    if (pl > 1) { px /= pl; py /= pl; }

    e.x += (dx * e.speed + px * B.enemySeparationSpeed) * dt;
    e.y += (dy * e.speed + py * B.enemySeparationSpeed) * dt;
    e.x = Math.min(Math.max(e.x, e.radius), B.arena - e.radius);
    e.y = Math.min(Math.max(e.y, e.radius), B.arena - e.radius);

    e.attackCooldown = Math.max(0, e.attackCooldown - dt);
    const contact = e.radius + B.heroRadius;
    if (hero.respawn <= 0 && hero.invuln <= 0 && e.attackCooldown <= 0 &&
        (e.x - hero.x) ** 2 + (e.y - hero.y) ** 2 <= contact * contact) {
      e.attackCooldown = B.enemyAttackInterval;
      damageHero(e.damage);
    }
  }

  resolveEnemyOverlap();
}

// Steering alone cannot clear a pile: an enemy buried in the middle receives
// pushes from every side, they cancel to nothing, and it keeps driving inward
// while the crowd closes over it. Only moving bodies directly fixes that.
function resolveEnemyOverlap() {
  if (enemies.length < 2) return;

  for (let pass = 0; pass < B.enemyOverlapIterations; pass++) {
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i];
      for (let j = i + 1; j < enemies.length; j++) {
        const b = enemies[j];
        const ox = a.x - b.x, oy = a.y - b.y;
        const min = a.radius + b.radius;
        const d2 = ox * ox + oy * oy;
        if (d2 >= min * min) continue;

        let nx, ny;
        if (d2 > 1e-6) {
          const d = Math.sqrt(d2);
          nx = ox / d; ny = oy / d;
        } else {
          // Exactly coincident: no direction to separate along, so pick one.
          const ang = ((i + j) % 360) * Math.PI / 180;
          nx = Math.cos(ang); ny = Math.sin(ang);
        }

        const overlap = min - Math.sqrt(d2);
        // Split by size, so a boss shrugs off minions rather than being
        // herded around by them.
        const shareA = b.radius / min;
        a.x += nx * overlap * shareA;
        a.y += ny * overlap * shareA;
        b.x -= nx * overlap * (1 - shareA);
        b.y -= ny * overlap * (1 - shareA);

        a.x = Math.min(Math.max(a.x, a.radius), B.arena - a.radius);
        a.y = Math.min(Math.max(a.y, a.radius), B.arena - a.radius);
        b.x = Math.min(Math.max(b.x, b.radius), B.arena - b.radius);
        b.y = Math.min(Math.max(b.y, b.radius), B.arena - b.radius);
      }
    }
  }
}

// Denominations, biggest first. Because the smallest is worth 1, greedy always
// lands on the exact payout — the total a kill pays is unchanged.
const COIN_ORDER = Object.keys(B.coinValues).sort((a, b) => B.coinValues[b] - B.coinValues[a]);

function makeChange(count) {
  if (count <= 0) return [];
  let remaining = count;
  const out = [];

  for (const kind of COIN_ORDER) {
    const unit = B.coinValues[kind];
    if (remaining < unit) continue;

    const coins = Math.floor(remaining / unit);
    remaining -= coins * unit;

    // Stack rather than spawning one pickup per coin when a boss pays in bulk.
    const pickups = Math.min(coins, B.maxPickupsPerDenomination);
    const per = Math.floor(coins / pickups);
    const extra = coins % pickups;
    for (let i = 0; i < pickups; i++) {
      out.push({ kind, value: (per + (i < extra ? 1 : 0)) * unit });
    }
  }
  return out;
}

function dropTokens(x, y, count) {
  for (const coin of makeChange(count)) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 110;
    tokens.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      kind: coin.kind, value: coin.value,
      age: 0, settle: 0.12 + Math.random() * 0.18, magnet: false, speed: 0,
    });
  }
}

function stepTokens(dt) {
  const cap = carryCapacity();
  const radius = pickupRadius();

  for (const t of tokens) {
    t.age += dt;

    if (t.settle > 0) {
      t.settle -= dt;
      t.x += t.vx * dt; t.y += t.vy * dt;
      const decay = Math.max(0, 1 - dt * 5);
      t.vx *= decay; t.vy *= decay;
      continue;
    }

    // A full stack stops attracting. This is the moment the Satchel
    // upgrade sells itself without a word of tutorial text.
    if (hero.carried >= cap || hero.respawn > 0) continue;

    const dx = hero.x - t.x, dy = hero.y - t.y;
    const dist = Math.hypot(dx, dy);
    if (t.magnet || dist <= radius) {
      t.magnet = true;
      t.speed = Math.min(B.tokenMagnetSpeed, t.speed + B.tokenMagnetAcceleration * dt);
      t.x += (dx / (dist || 1)) * t.speed * dt;
      t.y += (dy / (dist || 1)) * t.speed * dt;

      if (dist <= B.heroRadius) {
        // Coins are taken whole. Nibbling a ten-value coin down to three
        // would leave a BTC on the floor worth the same as a SAT, and the
        // denomination would stop meaning anything. A coin too big for the
        // satchel waits — the clearest argument the Satchel upgrade can make.
        if (cap - hero.carried >= t.value) {
          hero.carried += t.value;
          carriedCoins.push(t.kind);
          t.value = 0;
        } else {
          t.magnet = false;
          t.speed = 0;
        }
      }
    }
  }

  tokens = tokens.filter(t => t.value > 0 && t.age <= B.tokenLifetime);
}

function depositWhole(amount) {
  depositRemainder += amount;
  const whole = Math.floor(depositRemainder);
  depositRemainder -= whole;
  return whole;
}

function stepDeposits(dt) {
  if (hero.respawn > 0 || hero.carried <= 0) return;
  const r = B.plotInteractionRadius;

  if ((hero.x - bankPos.x) ** 2 + (hero.y - bankPos.y) ** 2 <= r * r) {
    const whole = depositWhole(Math.min(hero.carried, B.depositRate * dt));
    if (whole > 0) { hero.carried -= whole; bank += whole; }
    return;
  }

  for (const p of plots) {
    if ((hero.x - p.x) ** 2 + (hero.y - p.y) ** 2 > r * r) continue;
    const target = towerCost(p.level);
    const needed = target - p.deposited;
    if (needed <= 0) continue;

    const whole = depositWhole(Math.min(Math.min(hero.carried, needed), B.depositRate * dt));
    if (whole <= 0) return;

    hero.carried -= whole;
    p.deposited += whole;

    if (p.deposited >= target) {
      p.deposited = 0;
      p.level += 1;
      p.pulse = 0.35;
      shake = Math.min(26, shake + 6);
      effects.push({
        kind: "text", x: p.x, y: p.y, life: 1.0, max: 1.0, color: "#6fd1a0",
        text: p.level === 1 ? "Tower built" : `Tower Lv ${p.level}`,
      });
      burst(p.x, p.y, "#6fd1a0", 14);
    }
    return;
  }
}

function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 150;
    effects.push({ kind: "bit", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.34, max: 0.34, color });
  }
}

function cleanup() {
  const survivors = [];
  for (const e of enemies) {
    if (e.health > 0) { survivors.push(e); continue; }
    killed++;
    // Greed is the one power-up that touches income.
    const payout = active.greed > 0 ? Math.round(e.drop * B.greedTokenMultiplier) : e.drop;
    dropTokens(e.x, e.y, payout);
    burst(e.x, e.y, e.boss ? "#c74edb" : "#e45c6b", e.boss ? 20 : 6);
    if (e.boss) shake = Math.min(26, shake + 14);
  }
  enemies = survivors;
}

function stepEffects(dt) {
  for (const f of effects) {
    f.life -= dt;
    if (f.kind === "bit") { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; }
    if (f.kind === "text") f.y += 52 * dt;
  }
  effects = effects.filter(f => f.life > 0);
}

function step(dt) {
  elapsed += dt;
  stepWaves(dt);
  // Before the hero moves, so a boon picked up this frame applies to it.
  stepPowerUps(dt);
  stepHero(dt);
  stepSword(dt);
  stepTowers(dt);
  stepEnemies(dt);
  stepTokens(dt);
  stepDeposits(dt);
  trimCarriedCoins();
  cleanup();
  stepEffects(dt);
}

/* ---- Rendering ------------------------------------------------------ */

let vw = 0, vh = 0, scale = 1, dpr = 1;
const TAU = Math.PI * 2;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  vw = innerWidth; vh = innerHeight;
  canvas.width = Math.floor(vw * dpr);
  canvas.height = Math.floor(vh * dpr);
  canvas.style.width = vw + "px";
  canvas.style.height = vh + "px";
  scale = Math.min(vw, vh) / B.visibleWorldWidth;
}
addEventListener("resize", resize);
resize();

// World Y is up; screen Y is down.
const sx = wx => (wx - camX) * scale + vw / 2;
const sy = wy => vh / 2 - (wy - camY) * scale;

/* ---- Drawing primitives ---------------------------------------------
   Gradients are the expensive part of a canvas frame, so every one is
   built once at the origin and cached; callers translate into place.
   ------------------------------------------------------------------- */

const radialCache = new Map();
const linearCache = new Map();

function cached(store, key, make) {
  let g = store.get(key);
  if (!g) {
    g = make();
    if (store.size > 240) store.clear();
    store.set(key, g);
  }
  return g;
}

// Every light, glow and shadow in the scene is this one falloff, so the
// lighting reads as a single system rather than per-object decoration.
function glow(px, py, radius, inner, outer) {
  if (radius <= 0) return;
  const r = Math.round(radius);
  const g = cached(radialCache, r + "|" + inner + "|" + outer, () => {
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    grad.addColorStop(0, inner);
    grad.addColorStop(1, outer);
    return grad;
  });
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function additive(fn) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  fn();
  ctx.restore();
}

// A squashed blob under an entity. The cheapest thing that stops sprites
// reading as stickers pasted onto the background.
function contactShadow(x, y, r, alpha) {
  ctx.save();
  ctx.translate(sx(x), sy(y) + r * 0.5 * scale);
  ctx.scale(1, 0.36);
  glow(0, 0, r * 1.7 * scale, "rgba(0,0,0," + alpha + ")", "rgba(0,0,0,0)");
  ctx.restore();
}

// A flat disc reads as a hole punched in the floor; a shaded one reads as
// a body. Light comes from the upper left everywhere in this scene.
function shadedBall(px, py, pr, top, bottom, rim) {
  const r = Math.round(pr);
  const g = cached(linearCache, r + "|" + top + "|" + bottom, () => {
    const grad = ctx.createLinearGradient(0, -r, 0, r);
    grad.addColorStop(0, top);
    grad.addColorStop(1, bottom);
    return grad;
  });
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, pr, 0, TAU);
  ctx.fill();

  if (rim) {
    // Only the lower arc catches the rim, which is what sells the volume.
    ctx.strokeStyle = rim;
    ctx.lineWidth = Math.max(1.2, pr * 0.13);
    ctx.beginPath();
    ctx.arc(0, 0, pr - ctx.lineWidth / 2, TAU * 0.06, TAU * 0.44);
    ctx.stroke();
  }

  ctx.fillStyle = "rgba(255,255,255,0.2)";
  ctx.beginPath();
  ctx.ellipse(-pr * 0.28, -pr * 0.38, pr * 0.36, pr * 0.24, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// Positional hash — same cell, same value, every frame and every run.
function hash2(i, j) {
  let h = Math.imul(i, 374761393) + Math.imul(j, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Nothing off-screen is worth a shadow and a glow. Tokens especially pile
// up during a swarm, and each one costs a dozen canvas calls.
function onScreen(x, y, pad) {
  const px = sx(x), py = sy(y), m = (pad || 40) * scale;
  return px > -m && px < vw + m && py > -m && py < vh + m;
}

function polygon(px, py, r, sides, rot) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = rot + (i / sides) * TAU;
    const X = px + Math.cos(a) * r, Y = py + Math.sin(a) * r;
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.closePath();
}

function ring(x, y, r, color, width, dash) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.arc(sx(x), sy(y), r * scale, 0, TAU);
  ctx.stroke();
  ctx.restore();
}

// Denominations are told apart by colour and size, not by a symbol — at eight
// pixels across a glyph is mud. Higher tiers are bigger and brighter, so a
// good drop is legible from the other side of the arena.
// Each boon gets its own colour and a glyph drawn from primitives, so they are
// told apart at a glance across the arena rather than read.
const POWER_STYLE = {
  frenzy:  { label: "Frenzy",  color: "#ff8f4d", glow: "255,143,77" },
  magnet:  { label: "Magnet",  color: "#6bc7ff", glow: "107,199,255" },
  greed:   { label: "Greed",   color: "#ffcb3d", glow: "255,203,61" },
  bulwark: { label: "Bulwark", color: "#9fe870", glow: "159,232,112" },
  surge:   { label: "Surge",   color: "#c74edb", glow: "199,78,219" },
};

const COIN_STYLE = {
  sat: { top: "#f2cd9a", mid: "#c98a4b", low: "#6d4213", edge: "#4a2c0c", r: 7.0, ring: false },
  eth: { top: "#d7e0f8", mid: "#8fa2d8", low: "#404e7c", edge: "#28304d", r: 8.2, ring: false },
  sol: { top: "#b4f4e6", mid: "#4fd6c0", low: "#166b5f", edge: "#0d4239", r: 9.4, ring: true },
  btc: { top: "#ffeaa0", mid: "#ffcb3d", low: "#a9760c", edge: "#6d4c07", r: 10.8, ring: true },
};

// A coin seen almost edge-on, spinning. Width oscillates; the highlight rides
// the face so the spin is legible at eight pixels across.
function coin(px, py, r, spin, kind) {
  const st = COIN_STYLE[kind] || COIN_STYLE.sat;
  // Floored well above zero: a coin caught exactly edge-on is a sliver, and
  // a floor covered in slivers reads as scattered sticks, not treasure.
  const rx = Math.max(r * 0.38, Math.abs(Math.cos(spin)) * r);
  const g = cached(linearCache, Math.round(r) + "|" + (kind || "sat"), () => {
    const grad = ctx.createLinearGradient(0, -Math.round(r), 0, Math.round(r));
    grad.addColorStop(0, st.top);
    grad.addColorStop(0.45, st.mid);
    grad.addColorStop(1, st.low);
    return grad;
  });
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, r, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = st.edge;
  ctx.lineWidth = Math.max(1, r * 0.15);
  ctx.stroke();
  if (st.ring && rx > r * 0.5) {
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx * 0.52, r * 0.52, 0, 0, TAU);
    ctx.stroke();
  }
  if (rx > r * 0.35) {
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath();
    ctx.ellipse(-rx * 0.28, -r * 0.34, rx * 0.3, r * 0.22, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/* ---- Ground ---------------------------------------------------------- */

function drawGround() {
  ctx.fillStyle = "#070a0e";
  ctx.fillRect(0, 0, vw, vh);

  const left = sx(0), top = sy(B.arena), size = B.arena * scale;
  const cx = sx(B.base.x), cy = sy(B.base.y);

  ctx.save();
  ctx.beginPath();
  ctx.rect(left, top, size, size);
  ctx.clip();

  ctx.fillStyle = "#1a2130";
  ctx.fillRect(left, top, size, size);

  // Lit from the middle, so the stations sit in the bright part of the
  // floor and the arena edges fall away into the dark.
  glow(cx, cy, B.arena * 0.62 * scale, "#2c3a4d", "rgba(44,58,77,0)");

  // The worn ring linking the stations. It is the route the loop asks the
  // player to walk, so the floor says so out loud.
  const pr = B.plotRingRadius * scale;
  ctx.strokeStyle = "#26313f";
  ctx.lineWidth = 58 * scale;
  ctx.beginPath();
  ctx.arc(cx, cy, pr, 0, TAU);
  ctx.stroke();
  ctx.strokeStyle = "#3b4a5e";
  ctx.lineWidth = 1.5;
  for (const off of [-29 * scale, 29 * scale]) {
    ctx.beginPath();
    ctx.arc(cx, cy, pr + off, 0, TAU);
    ctx.stroke();
  }

  // Grid, kept faint — it exists so movement has something to read
  // against, not to be looked at.
  const spacing = 100;
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  const x0 = Math.floor((camX - vw / 2 / scale) / spacing) * spacing;
  const x1 = camX + vw / 2 / scale;
  for (let x = x0; x <= x1; x += spacing) { ctx.moveTo(sx(x), 0); ctx.lineTo(sx(x), vh); }
  const y0 = Math.floor((camY - vh / 2 / scale) / spacing) * spacing;
  const y1 = camY + vh / 2 / scale;
  for (let y = y0; y <= y1; y += spacing) { ctx.moveTo(0, sy(y)); ctx.lineTo(vw, sy(y)); }
  ctx.stroke();

  // Flagstones. Without them the floor is a bare grid and the hero reads as
  // sliding over nothing. Positions are hashed from the cell so they stay
  // put rather than crawling with the camera.
  for (const [tint, pass] of [["rgba(255,255,255,0.030)", 0], ["rgba(0,0,0,0.16)", 1]]) {
    ctx.fillStyle = tint;
    for (let gx = x0; gx <= x1; gx += spacing) {
      for (let gy = y0; gy <= y1; gy += spacing) {
        const i = Math.round(gx / spacing), j = Math.round(gy / spacing);
        for (let k = 0; k < 3; k++) {
          const a = hash2(i + pass * 91, j * 31 + k);
          const b = hash2(i * 17 + k, j + pass * 57);
          const s = (5 + hash2(i + k, j - k) * 13) * scale;
          ctx.fillRect(sx(gx + a * spacing), sy(gy + b * spacing), s, s * 0.62);
        }
      }
    }
  }
  ctx.restore();

  // Wall: a dark outer mass with a lit inner lip.
  ctx.strokeStyle = "#05070a";
  ctx.lineWidth = 14;
  ctx.strokeRect(left - 7, top - 7, size + 14, size + 14);
  ctx.strokeStyle = "#414d63";
  ctx.lineWidth = 3;
  ctx.strokeRect(left, top, size, size);
}

/* ---- Stations -------------------------------------------------------- */

function label(text, x, y, color) {
  ctx.save();
  ctx.font = "700 13px ui-sans-serif, -apple-system, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.letterSpacing = "1.5px";
  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillText(text, sx(x), sy(y) + 1.5);
  ctx.fillStyle = color;
  ctx.fillText(text, sx(x), sy(y));
  ctx.restore();
}

// Towers are drawn as structures rising from their ground point. Faking
// height like this is the whole difference between a tower and a dot.
function drawTower(p) {
  const px = sx(p.x), py = sy(p.y);
  const w = B.towerRadius * scale;
  const tiers = Math.min(p.level, 8);
  const h = (52 + tiers * 11) * scale * (1 + p.pulse * 0.45);
  const topY = py - h;
  const topW = w * 0.58;

  contactShadow(p.x, p.y, B.towerRadius * 1.2, 0.5);

  // Footing.
  ctx.fillStyle = "#28313e";
  ctx.beginPath();
  ctx.ellipse(px, py, w * 1.2, w * 0.48, 0, 0, TAU);
  ctx.fill();

  // Shaft, lit down one side.
  const key = Math.round(w) + "|tower";
  const g = cached(linearCache, key, () => {
    const grad = ctx.createLinearGradient(-Math.round(w), 0, Math.round(w), 0);
    grad.addColorStop(0, "#2f6350");
    grad.addColorStop(0.34, "#6fd1a0");
    grad.addColorStop(1, "#255043");
    return grad;
  });
  ctx.save();
  ctx.translate(px, 0);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-w, py);
  ctx.lineTo(-topW, topY);
  ctx.lineTo(topW, topY);
  ctx.lineTo(w, py);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "rgba(6,12,10,0.55)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  // One course line per level, so the level is legible without reading it.
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1.5;
  for (let i = 1; i <= tiers; i++) {
    const t = i / (tiers + 1);
    const yy = py + (topY - py) * t;
    const ww = w + (topW - w) * t;
    ctx.beginPath();
    ctx.moveTo(px - ww, yy);
    ctx.lineTo(px + ww, yy);
    ctx.stroke();
  }

  // Parapet overhangs the shaft — that flare is what separates a tower
  // from a traffic cone — with merlons standing proud of it.
  const c = topW * 0.62;
  ctx.fillStyle = "#8fe3bb";
  ctx.fillRect(px - topW * 1.5, topY - c * 0.8, topW * 3, c * 0.8);
  ctx.fillStyle = "#4f9c7c";
  ctx.fillRect(px - topW * 1.5, topY - c * 0.14, topW * 3, c * 0.14);
  ctx.fillStyle = "#8fe3bb";
  for (let i = -1; i <= 1; i++) {
    ctx.fillRect(px + i * topW * 0.98 - c * 0.28, topY - c * 1.7, c * 0.56, c * 0.95);
  }

  // The archer turns to whatever the tower would shoot at.
  const target = nearestEnemy(p.x, p.y, B.towerRange);
  const aim = target ? Math.atan2(target.y - p.y, target.x - p.x) : Math.PI / 2;
  ctx.fillStyle = "#eafaf2";
  ctx.beginPath();
  ctx.arc(px + Math.cos(aim) * topW * 0.4,
          topY - c * 1.05 - Math.sin(aim) * topW * 0.16,
          c * 0.34, 0, TAU);
  ctx.fill();
}

function drawStations() {
  const r = B.plotInteractionRadius;
  const carrying = hero.carried > 0;

  // ---- Bank: a vault plate, not a circle on the floor. ----------------
  const bx = sx(bankPos.x), by = sy(bankPos.y), br = r * scale;
  additive(() => glow(bx, by, br * 2.1,
    carrying ? "rgba(255,203,61,0.20)" : "rgba(255,203,61,0.08)", "rgba(255,203,61,0)"));

  polygon(bx, by, br, 8, Math.PI / 8);
  ctx.fillStyle = "#1a1f28";
  ctx.fill();
  ctx.strokeStyle = carrying ? "#ffcb3d" : "rgba(255,203,61,0.5)";
  ctx.lineWidth = 3;
  ctx.stroke();

  polygon(bx, by, br * 0.66, 8, Math.PI / 8);
  ctx.strokeStyle = "rgba(255,203,61,0.22)";
  ctx.lineWidth = 2;
  ctx.stroke();

  const vaultCoins = ["sat", "sol", "btc"];
  for (let i = 0; i < 3; i++) coin(bx, by + (6 - i * 6) * scale, 9 * scale, 0, vaultCoins[i]);
  label("BANK", bankPos.x, bankPos.y - r - 12, "#ffcb3d");

  // ---- Plots ----------------------------------------------------------
  // Only the nearest empty plot is tagged. Six BUILD labels at once is
  // noise, and the one you are walking towards is the only useful answer.
  let prompt = null, best = Infinity;
  if (carrying) {
    for (const p of plots) {
      if (p.level > 0) continue;
      const d = (p.x - hero.x) ** 2 + (p.y - hero.y) ** 2;
      if (d < best) { best = d; prompt = p; }
    }
  }

  for (const p of plots) {
    if (p.level > 0) {
      ring(p.x, p.y, r, "rgba(111,209,160,0.28)", 2);
      drawTower(p);
      label("LV " + p.level, p.x, p.y - r - 12, "#8fe3bb");
    } else {
      ring(p.x, p.y, r, carrying ? "#8894a6" : "#3a4454", 3, [12, 9]);
      // A ghost of what would stand here, so an empty plot advertises itself.
      ctx.save();
      ctx.globalAlpha = carrying ? 0.3 : 0.14;
      const px = sx(p.x), py = sy(p.y), w = B.towerRadius * scale;
      ctx.fillStyle = "#6fd1a0";
      ctx.beginPath();
      ctx.moveTo(px - w, py);
      ctx.lineTo(px - w * 0.7, py - 40 * scale);
      ctx.lineTo(px + w * 0.7, py - 40 * scale);
      ctx.lineTo(px + w, py);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      if (p === prompt) label("BUILD", p.x, p.y - r - 12, "#8894a6");
    }

    if (p.deposited > 0) {
      const frac = Math.min(1, p.deposited / towerCost(p.level));
      ctx.save();
      ctx.strokeStyle = "#ffcb3d";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(sx(p.x), sy(p.y), (r - 8) * scale, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
      ctx.stroke();
      ctx.restore();
    }
  }
}

/* ---- Hero ------------------------------------------------------------ */

// The blade is drawn, not implied. The swing effect drives it: it winds
// back over the first 40% of its life, then sweeps the same arc the hit
// test uses.
function drawSword() {
  const swing = effects.find(f => f.kind === "swing");
  const half = B.swordArc * 0.5;
  let a = hero.facing - half * 0.8, reach = 0.82;

  if (swing) {
    const k = 1 - swing.life / swing.max;
    if (k < 0.4) {
      const t = k / 0.4;
      a = hero.facing + half * (0.15 + 0.95 * t);
      reach = 0.82 + 0.22 * t;
    } else {
      const t = (k - 0.4) / 0.6;
      const e = 1 - Math.pow(1 - t, 3);
      a = hero.facing + half * 1.1 - half * 2.05 * e;
      reach = 1.04 - 0.22 * e;
    }
  }

  // Drawn from inside the body so the hero appears to hold it, and stopped
  // well short of the hit radius — the arc effect is what communicates
  // reach. Too long reads as a needle, too wide as a cone.
  const grip = B.heroRadius * 0.1 * scale;
  const guard = B.heroRadius * 1.04 * scale;          // just clear of the body
  const r1 = (B.heroRadius + B.swordRange * 0.6) * scale * reach;
  const w0 = B.heroRadius * 0.25 * scale;
  const taper = guard + (r1 - guard) * 0.74;

  ctx.save();
  ctx.translate(sx(hero.x), sy(hero.y));
  ctx.rotate(-a);

  // Grip, then crossguard, then blade. A blade that tapers all the way from
  // the hand reads as a needle; parallel sides with a short point read as a
  // sword, and the guard is what makes the hand legible.
  ctx.strokeStyle = "#5c4326";
  ctx.lineWidth = w0 * 0.8;
  ctx.beginPath();
  ctx.moveTo(grip, 0);
  ctx.lineTo(guard, 0);
  ctx.stroke();

  const g = cached(linearCache, Math.round(r1) + "|blade", () => {
    const grad = ctx.createLinearGradient(0, -20, 0, 20);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.5, "#dceaf8");
    grad.addColorStop(1, "#8ea4ba");
    return grad;
  });
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(guard, -w0);
  ctx.lineTo(taper, -w0);
  ctx.lineTo(r1, 0);
  ctx.lineTo(taper, w0);
  ctx.lineTo(guard, w0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "rgba(10,18,26,0.75)";
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Fuller down the middle of the blade.
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = Math.max(1, w0 * 0.28);
  ctx.beginPath();
  ctx.moveTo(guard + w0, 0);
  ctx.lineTo(taper, 0);
  ctx.stroke();

  ctx.fillStyle = "#e0a94b";
  ctx.fillRect(guard - w0 * 0.42, -w0 * 2.1, w0 * 0.84, w0 * 4.2);
  ctx.restore();
}

function drawCarry() {
  const visible = Math.min(hero.carried, 10);
  if (visible === 0) return;
  const full = hero.carried >= carryCapacity();
  const bx = sx(hero.x);
  const by = sy(hero.y) - (B.heroRadius + 14) * scale;

  if (full) {
    additive(() => glow(bx, by - visible * 3.5 * scale, 42 * scale,
      "rgba(255,203,61,0.28)", "rgba(255,203,61,0)"));
  }

  // Shows the newest coins, so a lucky BTC is visible on the stack instead of
  // being averaged into a column of identical discs.
  const shown = carriedCoins.slice(-visible);
  for (let i = 0; i < visible; i++) {
    const kind = shown[i] || "sat";
    const st = COIN_STYLE[kind];
    const wobble = Math.sin(i * 1.7 + elapsed * 3) * 2.2 * scale;
    ctx.save();
    ctx.translate(bx + wobble, by - i * 7 * scale);
    ctx.scale(1, 0.62);
    coin(0, 0, st.r * 1.05 * scale, 0, kind);
    ctx.restore();
  }

  ctx.save();
  ctx.font = "700 15px ui-monospace, Menlo, monospace";
  ctx.textAlign = "center";
  const ty = by - visible * 7 * scale - 12 * scale;
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillText(String(hero.carried), bx, ty + 1.5);
  ctx.fillStyle = full ? "#ffcb3d" : "#e8edf5";
  ctx.fillText(String(hero.carried), bx, ty);
  ctx.restore();
}

function drawHero() {
  const down = hero.respawn > 0;
  ctx.globalAlpha = down ? 0.22
    : hero.invuln > 0 ? 0.55 + Math.abs(Math.sin(elapsed * 26)) * 0.4
    : 1;

  contactShadow(hero.x, hero.y, B.heroRadius, 0.55);
  additive(() => glow(sx(hero.x), sy(hero.y), B.heroRadius * 3 * scale,
    "rgba(107,199,255,0.13)", "rgba(107,199,255,0)"));

  // Sword first, body over it: the hilt disappears behind the hero, which
  // is what makes it read as held rather than stuck on. The blade shows
  // facing on its own, so there is no crest to fight the highlight.
  if (!down) drawSword();
  shadedBall(sx(hero.x), sy(hero.y), B.heroRadius * scale, "#b0e4ff", "#2b7cb2", "#8fd6ff");
  ctx.globalAlpha = 1;

  // Bulwark is worn, not just listed in the HUD — you can see you are safe.
  if (active.bulwark > 0 && !down) {
    const r = B.heroRadius * 1.5 * scale;
    const fading = active.bulwark < 1.5;
    ctx.save();
    ctx.globalAlpha = fading ? 0.45 + Math.abs(Math.sin(elapsed * 14)) * 0.45 : 1;
    additive(() => glow(sx(hero.x), sy(hero.y), r * 1.7,
      "rgba(159,232,112,0.2)", "rgba(159,232,112,0)"));
    ctx.strokeStyle = "rgba(159,232,112,0.85)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(sx(hero.x), sy(hero.y), r, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  if (down) return;
  drawCarry();
}

/* ---- Enemies --------------------------------------------------------- */

function drawEnemies() {
  for (const e of enemies) {
    if (!onScreen(e.x, e.y, e.radius + 40)) continue;
    const grow = Math.min(1, (elapsed - e.born) / 0.22);
    const pop = 0.35 + 0.65 * (1 - Math.pow(1 - grow, 3));
    const r = e.radius * pop;
    // A small bob turns a sliding circle into something walking.
    const bob = Math.sin(elapsed * 7.5 + e.born * 11) * r * 0.08;
    const y = e.y + bob;
    const px = sx(e.x), py = sy(y), pr = r * scale;

    contactShadow(e.x, e.y, r, 0.5);

    if (e.boss) {
      const pulse = 0.14 + Math.sin(elapsed * 4) * 0.05;
      additive(() => glow(px, py, r * 3.2 * scale,
        "rgba(199,78,219," + pulse.toFixed(3) + ")", "rgba(199,78,219,0)"));
      // Crown, so a boss is a different silhouette and not just a bigger dot.
      ctx.fillStyle = "#e6a6f2";
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(px + i * pr * 0.5 - pr * 0.16, py - pr * 0.86);
        ctx.lineTo(px + i * pr * 0.5, py - pr * 1.4);
        ctx.lineTo(px + i * pr * 0.5 + pr * 0.16, py - pr * 0.86);
        ctx.closePath();
        ctx.fill();
      }
    }

    // Enemies pile onto the hero, and identical fills turn a crowd into one
    // pink mass. A per-instance tint plus a hard outline keeps the count
    // readable without lying about anyone's hit radius.
    const tint = hash2(Math.round(e.born * 1000), 7) < 0.5;
    if (e.flash > 0) shadedBall(px, py, pr, "#ffffff", "#ffd8de", "#ffffff");
    else if (e.boss) shadedBall(px, py, pr, "#e79bf5", "#6f2381", "#d98bea");
    else if (tint) shadedBall(px, py, pr, "#ff98a3", "#9d2836", "#ff8492");
    else shadedBall(px, py, pr, "#f9808f", "#87202f", "#f47585");

    ctx.strokeStyle = "rgba(22,8,12,0.5)";
    ctx.lineWidth = Math.max(1.2, pr * 0.09);
    ctx.beginPath();
    ctx.arc(px, py, pr - ctx.lineWidth / 2, 0, TAU);
    ctx.stroke();

    // Eyes track the hero. Two dots are all it takes to make a blob a threat.
    const a = Math.atan2(hero.y - e.y, hero.x - e.x);
    const ex = Math.cos(a), ey = -Math.sin(a);
    const nx = -ey, ny = ex;
    for (const side of [-1, 1]) {
      const ox = px + ex * pr * 0.34 + nx * side * pr * 0.34;
      const oy = py + ey * pr * 0.34 + ny * side * pr * 0.34;
      ctx.fillStyle = "#0d0f14";
      ctx.beginPath();
      ctx.arc(ox, oy, pr * 0.17, 0, TAU);
      ctx.fill();
    }

    if (e.boss) {
      const w = e.radius * 2.2 * scale;
      const frac = Math.max(0, e.health / e.maxHealth);
      const hx = px - w / 2, hy = py - (e.radius + 24) * scale;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(hx - 1.5, hy - 1.5, w + 3, 8);
      ctx.fillStyle = "#c74edb";
      ctx.fillRect(hx, hy, w * frac, 5);
    }
  }
}

/* ---- Tokens ---------------------------------------------------------- */

function drawTokens() {
  for (const t of tokens) {
    if (!onScreen(t.x, t.y, 24)) continue;
    const remaining = B.tokenLifetime - t.age;
    ctx.globalAlpha = remaining < 3 ? Math.max(0.15, remaining / 3) : 1;
    const px = sx(t.x), py = sy(t.y);
    const r = (COIN_STYLE[t.kind] || COIN_STYLE.sat).r * scale;
    // A swarm can leave two hundred of these on the floor at once, so a
    // loose token gets a flat shadow rather than the gradient one. The
    // bloom budget is spent on the stack above the head instead, which is
    // the read that matters.
    ctx.fillStyle = "rgba(0,0,0,0.38)";
    ctx.beginPath();
    ctx.ellipse(px, py + r * 0.62, r * 1.1, r * 0.42, 0, 0, TAU);
    ctx.fill();
    coin(px, py, r, elapsed * 3.4 + t.x * 0.07, t.kind);
  }
  ctx.globalAlpha = 1;
}

/* ---- Power-ups ------------------------------------------------------- */

function drawPowerUpGlyph(kind, r) {
  ctx.strokeStyle = "#0f141b";
  ctx.fillStyle = "#0f141b";
  ctx.lineWidth = Math.max(1.6, r * 0.16);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();

  if (kind === "frenzy") {                       // lightning bolt
    ctx.moveTo(r * 0.22, -r * 0.55);
    ctx.lineTo(-r * 0.18, r * 0.05);
    ctx.lineTo(r * 0.08, r * 0.05);
    ctx.lineTo(-r * 0.22, r * 0.58);
    ctx.stroke();
  } else if (kind === "magnet") {                // horseshoe
    ctx.arc(0, r * 0.05, r * 0.42, Math.PI, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r * 0.42, r * 0.05); ctx.lineTo(-r * 0.42, r * 0.45);
    ctx.moveTo(r * 0.42, r * 0.05); ctx.lineTo(r * 0.42, r * 0.45);
    ctx.stroke();
  } else if (kind === "greed") {                 // stacked coins
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.ellipse(0, i * r * 0.28, r * 0.44, r * 0.15, 0, 0, TAU);
      ctx.stroke();
    }
  } else if (kind === "bulwark") {               // shield
    ctx.moveTo(0, -r * 0.55);
    ctx.lineTo(r * 0.42, -r * 0.3);
    ctx.lineTo(r * 0.42, r * 0.12);
    ctx.quadraticCurveTo(r * 0.42, r * 0.5, 0, r * 0.6);
    ctx.quadraticCurveTo(-r * 0.42, r * 0.5, -r * 0.42, r * 0.12);
    ctx.lineTo(-r * 0.42, -r * 0.3);
    ctx.closePath();
    ctx.stroke();
  } else {                                        // surge — radiating burst
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      ctx.moveTo(Math.cos(a) * r * 0.2, Math.sin(a) * r * 0.2);
      ctx.lineTo(Math.cos(a) * r * 0.56, Math.sin(a) * r * 0.56);
    }
    ctx.stroke();
  }
}

function drawPowerUps() {
  for (const p of powerUps) {
    if (!onScreen(p.x, p.y, 60)) continue;
    const st = POWER_STYLE[p.kind];
    const px = sx(p.x), py = sy(p.y);
    const r = B.powerUpRadius * scale;

    // Fades and shrinks as it runs out, so the urgency is visible from afar.
    const left = B.powerUpGroundLifetime - p.age;
    ctx.globalAlpha = left < 3.5 ? Math.max(0.2, left / 3.5) : 1;

    const bob = Math.sin(elapsed * 3 + p.x * 0.02) * 4 * scale;
    const pulse = 1 + Math.sin(elapsed * 5 + p.y * 0.02) * 0.06;

    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(px, py + r * 0.7, r * 0.72, r * 0.26, 0, 0, TAU);
    ctx.fill();

    additive(() => glow(px, py + bob, r * 2.6,
      "rgba(" + st.glow + ",0.34)", "rgba(" + st.glow + ",0)"));

    ctx.save();
    ctx.translate(px, py + bob);
    ctx.scale(pulse, pulse);
    // Rounded capsule badge rather than a bare disc, so a boon never reads
    // as another coin lying on the floor.
    polygon(0, 0, r * 0.82, 6, elapsed * 0.5);
    ctx.fillStyle = st.color;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.lineWidth = 2;
    ctx.stroke();
    drawPowerUpGlyph(p.kind, r * 0.82);
    ctx.restore();

    ctx.globalAlpha = 1;
  }
}

/* ---- Effects --------------------------------------------------------- */

function drawEffects() {
  for (const f of effects) {
    if (!onScreen(f.x, f.y, 140)) continue;
    const k = f.life / f.max;

    if (f.kind === "swing") {
      // A wedge that is bright only at its outer edge reads as a sweep;
      // a flat filled wedge reads as a pie chart.
      const px = sx(f.x), py = sy(f.y);
      const R = (B.swordRange + B.heroRadius) * scale;
      const a0 = -f.facing - B.swordArc / 2, a1 = -f.facing + B.swordArc / 2;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(px, py, R * 0.3, px, py, R);
      g.addColorStop(0, "rgba(120,190,255,0)");
      g.addColorStop(0.78, "rgba(150,215,255," + (0.14 * k).toFixed(3) + ")");
      g.addColorStop(1, "rgba(232,246,255," + (0.5 * k).toFixed(3) + ")");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.arc(px, py, R, a0, a1);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(240,250,255," + (0.7 * k).toFixed(3) + ")";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(px, py, R * 0.96, a0, a1);
      ctx.stroke();
      ctx.restore();

    } else if (f.kind === "surge") {
      // An expanding ring rather than a filled blast, so the wave front is
      // legible and the enemies it is hitting stay visible through it.
      const e = 1 - Math.pow(1 - (1 - k), 2);
      const R = B.surgeRadius * scale * e;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(216,140,240," + (0.85 * k).toFixed(3) + ")";
      ctx.lineWidth = 6 * scale * k + 1.5;
      ctx.beginPath();
      ctx.arc(sx(f.x), sy(f.y), R, 0, TAU);
      ctx.stroke();
      glow(sx(f.x), sy(f.y), R * 0.9,
        "rgba(199,78,219," + (0.16 * k).toFixed(3) + ")", "rgba(199,78,219,0)");
      ctx.restore();

    } else if (f.kind === "tracer") {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = k;
      ctx.strokeStyle = "#a8e8c8";
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(sx(f.x), sy(f.y));
      ctx.lineTo(sx(f.tx), sy(f.ty));
      ctx.stroke();
      glow(sx(f.x), sy(f.y), 16 * scale, "rgba(168,232,200,0.5)", "rgba(168,232,200,0)");
      glow(sx(f.tx), sy(f.ty), 20 * scale, "rgba(220,255,238,0.45)", "rgba(220,255,238,0)");
      ctx.restore();

    } else if (f.kind === "bit") {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = k;
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(sx(f.x), sy(f.y), 3.4 * scale * k + 0.6, 0, TAU);
      ctx.fill();
      ctx.restore();

    } else if (f.kind === "text") {
      ctx.save();
      ctx.globalAlpha = Math.min(1, k * 2);
      ctx.font = "800 16px ui-sans-serif, -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.letterSpacing = "1px";
      const px = sx(f.x), py = sy(f.y) - (1 - k) * 22 * scale;
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillText(f.text.toUpperCase(), px, py + 1.5);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text.toUpperCase(), px, py);
      ctx.restore();
    }
  }
}

/* ---- Screen ---------------------------------------------------------- */

function drawStick() {
  if (!stick) return;
  const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
  const dist = Math.hypot(dx, dy) || 1;
  const clamped = Math.min(dist, MAX_TRAVEL);

  ctx.save();
  ctx.strokeStyle = "#ffffff40";
  ctx.fillStyle = "#ffffff0f";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(stick.ox, stick.oy, MAX_TRAVEL, 0, TAU);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#ffffff4d";
  ctx.beginPath();
  ctx.arc(stick.ox + (dx / dist) * clamped, stick.oy + (dy / dist) * clamped, 26, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// Pulls the eye to the middle of the screen, where the hero is.
function vignette() {
  const key = Math.round(vw) + "x" + Math.round(vh) + "|vig";
  const g = cached(radialCache, key, () => {
    const grad = ctx.createRadialGradient(0, 0, Math.min(vw, vh) * 0.45,
                                          0, 0, Math.max(vw, vh) * 0.8);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(1, "rgba(0,0,0,0.34)");
    return grad;
  });
  ctx.save();
  ctx.translate(vw / 2, vh / 2);
  ctx.fillStyle = g;
  ctx.fillRect(-vw / 2, -vh / 2, vw, vh);
  ctx.restore();
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawGround();
  drawStations();
  drawTokens();
  drawPowerUps();
  drawEnemies();
  drawHero();
  drawEffects();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vignette();
  drawStick();
}

/* ---- HUD wiring ----------------------------------------------------- */

const el = {
  wave: document.getElementById("wave"),
  health: document.getElementById("health"),
  healthWrap: document.getElementById("healthWrap"),
  bank: document.getElementById("bank"),
  bankWrap: document.getElementById("bankWrap"),
  carry: document.getElementById("carry"),
  towers: document.getElementById("towers"),
  buffs: document.getElementById("buffs"),
  rows: document.getElementById("rows"),
  drawer: document.getElementById("drawer"),
  toggle: document.getElementById("toggle"),
  banner: document.getElementById("banner"),
};

el.toggle.addEventListener("click", () => {
  const open = el.drawer.classList.toggle("open");
  el.toggle.textContent = open ? "Close" : "Upgrades";
});

const rowEls = UPGRADES.map(u => {
  const b = document.createElement("button");
  b.className = "row";
  b.type = "button";
  b.innerHTML =
    `<span style="flex:1"><span class="name">${u.name}</span><br><span class="blurb">${u.blurb}</span></span>` +
    `<span class="lv">LV 0</span><span class="price">0</span>`;
  b.addEventListener("click", () => {
    const cost = priceOf(u.key);
    if (bank < cost) return;
    bank -= cost;
    lv[u.key] += 1;
    syncHUD();
  });
  el.rows.appendChild(b);
  return { def: u, node: b, lv: b.querySelector(".lv"), price: b.querySelector(".price") };
});

function announce(text, boss, go) {
  el.banner.textContent = text;
  el.banner.classList.toggle("boss", !!boss);
  el.banner.classList.toggle("count", !go && /^\d+$/.test(text));
  el.banner.classList.toggle("go", !!go);
  el.banner.classList.remove("show");
  void el.banner.offsetWidth;
  el.banner.classList.add("show");
}

// Rows are created once per kind and shown or hidden, so a boon refreshing
// does not rebuild the DOM ten times a second.
const buffEls = {};
for (const kind of Object.keys(POWER_STYLE)) {
  if (kind === "surge") continue;              // instant, never runs
  const row = document.createElement("div");
  row.className = "buff";
  row.style.color = POWER_STYLE[kind].color;
  row.innerHTML = `<span>${POWER_STYLE[kind].label}</span><span class="bar"><i></i></span>`;
  row.style.display = "none";
  el.buffs.appendChild(row);
  buffEls[kind] = { row, fill: row.querySelector("i") };
}

function syncBuffs() {
  for (const kind of Object.keys(buffEls)) {
    const left = active[kind];
    const entry = buffEls[kind];
    if (left <= 0) { entry.row.style.display = "none"; continue; }
    entry.row.style.display = "flex";
    entry.fill.style.transform = `scaleX(${left / B.powerUpDurations[kind]})`;
  }
}

let hudTimer = 0;
function syncHUD() {
  const wave = Math.max(1, director.wave);
  el.wave.textContent = `Wave ${wave}`;
  el.wave.classList.toggle("boss", isBossWave(wave));

  const frac = Math.max(0, hero.health / B.heroMaxHealth);
  el.health.style.transform = `scaleX(${frac})`;
  el.healthWrap.classList.toggle("low", frac < 0.3);

  el.bank.textContent = bank;
  el.bankWrap.classList.toggle("dim", bank === 0);

  const cap = carryCapacity();
  el.carry.textContent = `${hero.carried}/${cap}`;
  el.carry.classList.toggle("full", hero.carried >= cap);

  const built = plots.filter(p => p.level > 0).length;
  el.towers.textContent = built === 1 ? "1 tower" : `${built} towers`;

  syncBuffs();

  for (const r of rowEls) {
    const cost = priceOf(r.def.key);
    r.lv.textContent = `LV ${lv[r.def.key]}`;
    r.price.textContent = cost;
    r.node.classList.toggle("can", bank >= cost);
  }
}

/* ---- Loop ----------------------------------------------------------- */

let last = 0, paused = false;
document.addEventListener("visibilitychange", () => {
  paused = document.hidden;
  if (!paused) last = performance.now();
});

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  // Clamp so a stall cannot advance the simulation by a huge step.
  const dt = Math.min(1 / 20, Math.max(0, (now - last) / 1000));
  last = now;
  if (paused) return;

  const stickInput = readStick();
  const keyInput = readKeys();
  const source = stickInput || keyInput || { x: 0, y: 0 };
  input.x = source.x; input.y = source.y;
  if (keyInput) hideHint();

  step(dt);

  // Soft follow, with shake layered on top rather than fighting it.
  const t = 1 - Math.pow(0.001, dt);
  camX += (hero.x - camX) * t;
  camY += (hero.y - camY) * t;
  shake = Math.max(0, shake - shake * 9 * dt - 0.4 * dt);
  const jitter = reduceMotion ? 0 : shake;
  const savedX = camX, savedY = camY;
  camX += (Math.random() * 2 - 1) * jitter / scale;
  camY += (Math.random() * 2 - 1) * jitter / scale;

  render();
  camX = savedX; camY = savedY;

  hudTimer += dt;
  if (hudTimer >= 0.1) { hudTimer = 0; syncHUD(); }
}

syncHUD();
requestAnimationFrame(frame);
</script>
